<!DOCTYPE html>
<html>
<head>
  <title>SPHERE Connect</title>
  <link rel="stylesheet" href="css/widget.css" />
</head>
<body>
  <div id="loginSection">
    <h3>Connect to SPHERE</h3>
    <input type="email" id="email" placeholder="SPHERE Email" />
    <input type="password" id="password" placeholder="SPHERE Password" />
    <button id="loginBtn">Login</button>
    <p id="loginError"></p>
  </div>

  <div id="connectedSection" style="display:none;">
    <p>Connected to SPHERE</p>
  </div>

  <div id="recordToolbar" style="display:none;">
    <button id="refreshRecordBtn" class="secondary">&#8635; Refresh</button>
  </div>
  <div id="recordView"></div>

  <script type="module" src="js/widget.js"></script>
</body>
</html>
